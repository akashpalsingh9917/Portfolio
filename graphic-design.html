<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edited Graphic Design | Akash Pal Singh</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #0a0a0a;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }
    header {
      background-color: #1A242F;
      color: #fff;
    }
    .design-section {
      margin: 50px 0;
    }
    .design-card {
      background: #111;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 30px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .design-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 15px #00d1ff33;
    }
    .design-card img {
      width: 100%;
      border-radius: 12px;
      margin-top: 15px;
    }
    h1, h4 {
      color: #00D1FF;
    }
    footer {
      background: #1A242F;
      text-align: center;
      padding: 20px 0;
      color: #aaa;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <header class="py-4 text-center">
    <h1>Edited Graphic Design</h1>
    <p>Check Out My Creative Design Projects</p>
  </header>

  <div class="container design-section">
    <div class="row g-4" id="designContainer">
      <!-- Designs will be auto-generated here -->
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Akash Pal Singh | All Rights Reserved</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const container = document.getElementById('designContainer');
    for (let i = 1; i <= 100; i++) {
      container.innerHTML += `
        <div class="col-md-6 col-lg-4">
          <div class="design-card">
            <h4>Design ${i}</h4>
            <img src="designs/design${i}.jpg" alt="Design ${i}">
          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
