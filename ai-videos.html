<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Videos | Akash Pal Singh</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #0a0a0a;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }
    header {
      background-color: #1A242F;
      color: #fff;
    }
    .video-section {
      margin: 50px 0;
    }
    .video-card {
      background: #111;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      margin-bottom: 30px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .video-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 15px #00d1ff33;
    }
    .video-card iframe {
      width: 100%;
      border-radius: 12px;
      border: none;
    }
    h1, h4 {
      color: #00D1FF;
    }
    footer {
      background: #1A242F;
      text-align: center;
      padding: 20px 0;
      color: #aaa;
      margin-top: 50px;
    }
  </style>
</head>

<body>

  <header class="py-4 text-center">
    <h1>AI Videos</h1>
    <p>Watch My Professional AI Video Projects</p>
  </header>

  <div class="container video-section">
    <div class="row g-4" id="videoContainer"></div>
  </div>

  <footer>
    <p>&copy; 2025 Akash Pal Singh | All Rights Reserved</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const container = document.getElementById('videoContainer');

    const videos = [
      "1FZ9kFO5nA042ZfpBY3QLVEeqSfOmxrVt",
      "1BVTKQtdeyvCs41MktjCAHOxlMH9kqcwr",
      "1GzXaXdUz5oTh1N-U5Mwfwg-qR3F5gKTV",
      "1DKplXwrjl2COqPTwnIavZl_On8CM2vn7",
      "1u0BfgsdMiIWovF74JKjYJFzs5OoMZU6V",
      "1c7mxF5B2NKmgjD-TOzuBpqwypu9bFny7",
      "1ocqxIEQQ-xds4NrMMAeyTeYyejAV5BxH"
    ];

    videos.forEach((id, index) => {
      container.innerHTML += `
        <div class="col-md-6 col-lg-4">
          <div class="video-card">
            <h4>AI Video ${index + 1}</h4>
            <iframe 
              src="https://drive.google.com/file/d/${id}/preview"
              height="250"
              allow="autoplay">
            </iframe>
          </div>
        </div>
      `;
    });
  </script>

</body>
</html>
