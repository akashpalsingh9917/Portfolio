    .video-section {
      margin: 50px 0;
    }
    .video-card {
      background: #111;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      margin-bottom: 30px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .video-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 15px #00d1ff33;
    }
    .video-card iframe {
      width: 100%;
      border-radius: 12px;
      border: none;
    }
    h1, h4 {
      color: #00D1FF;
    }
    footer {
      background: #1A242F;
      text-align: center;
      padding: 20px 0;
      color: #aaa;
      margin-top: 50px;
    }
  </style>
</head>
